[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube

# Set compilation mode to Debug (disables optimization, keeps variables for GDB)
build_type = debug

# Custom upload configuration via OpenOCD and DAPLink
upload_protocol = custom
upload_command = 
    "${PROJECT_DIR}\tool-openocd\bin\openocd.exe" -s "${PROJECT_DIR}/tool-openocd/openocd/scripts" -f interface/cmsis-dap.cfg -f target/stm32f4x.cfg -c "program {.pio/build/nucleo_f446re/firmware.elf} verify reset exit"

# Custom debug configuration via OpenOCD and DAPLink
debug_tool = custom
debug_server =
    ${PROJECT_DIR}\tool-openocd\bin\openocd.exe -s ${PROJECT_DIR}/tool-openocd/openocd/scripts -f interface/cmsis-dap.cfg -f target/stm32f4x.cfg

# Remove default HSE frequency definitions
build_unflags = -D HSE_VALUE=25000000

# Base parameters (indent each line with 4 spaces)
build_flags = 
    -D ARM_MATH_CM4
    -Wl,-u_printf_float
    -I include
    -D HSE_VALUE=8000000U
    -Wno-comment

platform_packages = toolchain-gccarmnoneeabi@~1.100301.0